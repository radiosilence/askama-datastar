name: Audit

# Cargo.lock against the RustSec advisory database, with deny.toml's ignores.
# ci-cd.yml calls this when dependencies change and on its scheduled runs,
# since advisories are also published against code that has not changed. A
# manual run audits main without the rest of the pipeline.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        # rust as well: cargo-deny reads the lockfile through `cargo metadata`,
        # which should be the cargo mise.toml installs rather than the runner's.
        with:
          install_args: just rust cargo-deny
      - run: just audit
